server {
    listen 80;
    server_name balbes-vps.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name balbes-vps.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/balbes-vps.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balbes-vps.duckdns.org/privkey.pem;

    # Стандартные настройки безопасности Certbot (желательно добавить вручную)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
	root /usr/share/nginx/html;
	index index.html;
	try_files $uri $uri/ /index.html;

    }

    location /api {
        # Перенаправляем на сервис fastapi-app на порт 8000
        proxy_pass http://fastapi-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
