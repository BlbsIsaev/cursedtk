version: '3.8'

services:
  fastapi-app:
    build: .
    container_name: prod_app
    restart: always
    environment:
      - PYTHONPATH=/app
      - PYTHONBUFFERED=1
      - DATABASE_URL=mysql+mysqlconnector://root:12345678@db:3306/farmers_market
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - fastapi-app
    restart: always
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: farmers_market
      MYSQL_USER: course_user
      MYSQL_PASSWORD: course_pass
      MYSQL_ROOT_PASSWORD: "12345678"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network


volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
